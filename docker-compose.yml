# Docker Compose for the drip-irrigation distribution-uniformity service.
#
#   docker compose up --build --abort-on-container-exit --exit-code-from verify verify
#                                          # build, one acceptance check, then stop and propagate its exit code
#   docker compose up -d api               # long-lived API on the host port
#   API_PORT=9090 docker compose up -d api # publish on host port 9090 instead
#
# API_PORT (default 8080) sets both the container listen port and the published
# host port, so the two services keep talking to each other on the same value.

name: drip-du

services:
  api:
    build:
      context: .
      target: runtime
    image: drip-du:latest
    command: ["api"]
    environment:
      API_PORT: ${API_PORT:-8080}
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${API_PORT:-8080}/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  verify:
    image: drip-du:latest
    build:
      context: .
      target: runtime
    command: ["verify"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: "http://api:${API_PORT:-8080}"
      VERIFY_PAYLOAD: "/data/payload.json"
    volumes:
      # Replace this file (or the whole mount) with the branch under test.
      - ./examples/acceptance-pass.json:/data/payload.json:ro
    # One-shot acceptance service: never restarted, removed when it exits.
    restart: "no"
